<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam C. Moreno - Links</title>
    <link rel="icon" href="https://i.imgur.com/9g37qhF.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        @keyframes envelopeShake {
            0% {
                transform: rotate(0deg) translateX(0);
            }
            25% {
                transform: rotate(-1.5deg) translateX(-1px);
            }
            50% {
                transform: rotate(0deg) translateX(0);
            }
            75% {
                transform: rotate(1.5deg) translateX(1px);
            }
            100% {
                transform: rotate(0deg) translateX(0);
            }
        }
        @keyframes staggerReveal {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes staggerRevealYoutube {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background-color: #ff0035;
            }
            50% {
                opacity: 1;
                transform: translateY(0);
                background-color: #ff0035;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background-color: #1a1a1a;
            }
        }
        @keyframes staggerRevealSubstack {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background-color: #fe5900;
            }
            50% {
                opacity: 1;
                transform: translateY(0);
                background-color: #fe5900;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background-color: #1a1a1a;
            }
        }
        @keyframes staggerRevealX {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background-color: #01050b;
            }
            50% {
                opacity: 1;
                transform: translateY(0);
                background-color: #01050b;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background-color: #1a1a1a;
            }
        }
        @keyframes staggerRevealInstagram {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background: url('https://i.imgur.com/ZizV2nb.png') center/cover;
            }
            50% {
                opacity: 1;
                transform: translateY(0);
                background: url('https://i.imgur.com/ZizV2nb.png') center/cover;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background: #1a1a1a;
            }
        }
        @keyframes staggerRevealTiktok {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background: url('https://i.imgur.com/TdWxh4k.png') center/cover;
            }
            50% {
                opacity: 1;
                transform: translateY(0);
                background: url('https://i.imgur.com/TdWxh4k.png') center/cover;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background: #1a1a1a;
            }
        }
        @keyframes staggerRevealEmail {
            0% {
                opacity: 0;
                transform: translateY(10px);
                background-color: #0A66C2;
            }
            50% {
                opacity: 1;
                transform: translateY(0);
                background-color: #0A66C2;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                background-color: #1a1a1a;
            }
        }
        @keyframes paperSlideOut {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-8px) scale(1.05);
            }
            100% {
                transform: translateY(-12px) scale(1.08);
            }
        }
        @keyframes envelopeBounce {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
            100% {
                transform: translateY(0);
            }
        }
        @keyframes envelopeSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        @keyframes envelopeFloat {
            0% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
            100% {
                transform: translateY(0);
            }
        }
        @keyframes envelopePulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
            }
        }
        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.7;
            position: relative;
        }
        .background-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.imgur.com/PMxvHya.jpeg');
            background-position: center 30%;
            background-size: cover;
            background-repeat: no-repeat;
            z-index: -999;
            pointer-events: none;
        }
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.75);
            z-index: -998;
            pointer-events: none;
        }
        header {
            padding: 30px 0;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            background: #0a0a0a;
            z-index: 100;
        }
        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-family: 'Anton', sans-serif;
            font-size: 28px;
            font-weight: 700;
            text-decoration: none;
            color: #fff;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            display: inline-block;
            position: relative;
            height: 28px;
            line-height: 28px;
        }
        .logo-full {
            display: inline-block;
            transition: opacity 0.5s ease;
            opacity: 1;
        }
        .logo-full.hidden {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .logo-short {
            display: inline-block;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        .logo-short.visible {
            opacity: 1;
        }
        nav {
            display: flex;
            gap: 40px;
        }
        nav a {
            text-decoration: none;
            color: #999;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        nav a:hover {
            color: #fff;
        }
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background: #fff;
            transition: width 0.3s ease;
        }
        nav a:hover::after {
            width: 100%;
        }
        section {
            opacity: 0;
        }
        section.visible {
            animation: fadeIn 1.0s ease-out forwards;
        }
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 40px;
            text-align: center;
        }
        .profile-image {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .profile-image:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }
        .profile-header {
            margin-bottom: 16px;
        }
        .username {
            font-size: 28px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .verified {
            width: 24px;
            height: 24px;
            display: inline-block;
            margin-left: -6px;
        }
        .shorts-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px;
        }
        .shorts-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
        }
        @keyframes slideCarousel {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        .shorts-carousel {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding: 20px 0;
            -webkit-overflow-scrolling: touch;
        }
        .shorts-carousel-auto {
            animation: slideCarousel 200s linear infinite;
        }
        .shorts-carousel::-webkit-scrollbar {
            display: none;
        }
        .shorts-carousel {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .short-item {
            flex: 0 0 280px;
            aspect-ratio: 9/16;
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
            animation: fadeIn 1.0s ease-out forwards;
            opacity: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .short-item:nth-child(1) { animation-delay: 0.1s; }
        .short-item:nth-child(2) { animation-delay: 0.2s; }
        .short-item:nth-child(3) { animation-delay: 0.3s; }
        .short-item:nth-child(4) { animation-delay: 0.4s; }
        .short-item:nth-child(5) { animation-delay: 0.5s; }
        .short-item:nth-child(6) { animation-delay: 0.6s; }
        .short-item:nth-child(7) { animation-delay: 0.7s; }
        .short-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }
        .short-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner-section {
            width: 100%;
            margin-top: 0;
            padding: 0 40px;
            display: flex;
            justify-content: center;
        }
        .banner-link {
            display: inline-block;
            max-width: 100%;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 20px;
            border-radius: 16px;
        }
        .banner-link img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            transition: transform 0.3s ease;
            border-radius: 12px;
        }
        .banner-link:hover img {
            transform: scale(1.02);
        }
        .shorts-carousel-auto {
            animation: none;
        }
        .tagline {
            font-size: 18px;
            color: #aaa;
            font-weight: 400;
            margin-bottom: 48px;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }
        .social-icon-link {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #1a1a1a;
            text-decoration: none;
            color: #fff;
            transition: all 0.3s ease;
            font-size: 24px;
        }
        .social-icon-link:hover {
            background: #fff;
            color: #000;
            transform: scale(1.15) translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
            animation-play-state: paused;
        }
        .substack-icon {
            filter: invert(1);
            width: 24px;
            height: 24px;
        }
        .social-icon-link:hover .substack-icon {
            filter: none;
        }
        .social-icon-link[title="Substack"]:hover {
            background-color: #fe5900;
        }
        .social-icon-link[title="Substack"]:hover .substack-icon {
            filter: invert(1);
        }
        .social-icon-link[title="YouTube"]:hover {
            background-color: #ff0035;
            color: #ffffff;
        }
        .social-icon-link[title="X"]:hover {
            background-color: #01050b;
            color: #ffffff;
        }
        .social-icon-link[title="Instagram"]:hover {
            background-image: url('https://i.imgur.com/ZizV2nb.png');
            background-size: cover;
            background-position: center;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .social-icon-link[title="TikTok"]:hover {
            background-image: url('https://i.imgur.com/TdWxh4k.png');
            background-size: cover;
            background-position: center;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .social-icon-link[title="TikTok"]:hover i.fab.fa-tiktok {
            opacity: 0;
        }
        .social-icon-link[title="Email"]:hover {
            background-color: #0A66C2;
            color: #ffffff;
        }
        .social-icon-link[title="Email"] {
            perspective: 1000px;
        }
        .social-icon-link[title="Email"]:hover i.fas.fa-envelope {
            animation: envelopeShake 0.5s ease-in-out infinite;
            transform-style: preserve-3d;
        }
        .social-icon-link:nth-child(1) {
            animation: staggerRevealX 0.8s ease-out 0s, iconFloat 2.1s ease-in-out 0.8s infinite;
        }
        .social-icon-link:nth-child(2) {
            animation: staggerRevealYoutube 0.8s ease-out 0.15s, iconFloat 2.1s ease-in-out 1.05s infinite;
        }
        .social-icon-link:nth-child(3) {
            animation: staggerRevealSubstack 0.8s ease-out 0.3s, iconFloat 2.1s ease-in-out 1.3s infinite;
        }
        .social-icon-link:nth-child(4) {
            animation: staggerRevealInstagram 0.8s ease-out 0.45s, iconFloat 2.1s ease-in-out 1.55s infinite;
        }
        .social-icon-link:nth-child(5) {
            animation: staggerRevealTiktok 0.8s ease-out 0.6s, iconFloat 2.1s ease-in-out 1.8s infinite;
        }
        .social-icon-link:nth-child(6) {
            animation: staggerRevealEmail 0.8s ease-out 0.75s, iconFloat 2.1s ease-in-out 2.05s infinite;
        }
        .links-grid {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 40px 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-item {
            padding: 16px 24px;
            background: #f9f9f9;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            text-decoration: none;
            color: #1a1a1a;
            transition: all 0.3s ease;
            font-weight: 500;
            animation: fadeIn 1.0s ease-out forwards;
            opacity: 0;
        }
        .link-item:nth-child(1) { animation-delay: 0.1s; }
        .link-item:nth-child(2) { animation-delay: 0.2s; }
        .link-item:nth-child(3) { animation-delay: 0.3s; }
        .link-item:nth-child(4) { animation-delay: 0.4s; }
        .link-item:nth-child(5) { animation-delay: 0.5s; }
        .link-item:nth-child(6) { animation-delay: 0.6s; }
        footer {
            background: #0a0a0a;
            padding: 40px;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #222;
        }
        @media (max-width: 768px) {
            .profile-container {
                padding: 60px 20px;
            }
            .username {
                font-size: 24px;
            }
            .tagline {
                font-size: 16px;
            }
            nav {
                gap: 20px;
                font-size: 13px;
            }
            .header-container {
                padding: 0 20px;
            }
            .links-grid {
                padding: 0 20px 60px;
            }
            .social-icons {
                gap: 16px;
            }
            .social-icon-link {
                width: 48px;
                height: 48px;
                font-size: 20px;
            }
            .banner-section {
                padding: 0 20px;
            }
            .banner-link {
                max-width: 500px;
                padding: 0;
            }
            .shorts-section {
                padding: 80px 0;
            }
            .shorts-carousel {
                padding: 20px 0 !important;
                gap: 15px;
            }
            .short-item {
                flex: 0 0 220px;
            }
            .shorts-carousel-auto {
                animation: none;
            }
        }

        /* Optional interactive WRX hatchback. Existing site styling is unchanged. */
        #wrx-car { position: absolute; left: 0; top: 0; width: 24px; height: 39px; z-index: 132; touch-action: none; cursor: grab; pointer-events: auto; user-select: none; filter: drop-shadow(0 8px 9px rgba(0,0,0,.55)); will-change: transform; }
        #wrx-car:active { cursor: grabbing; }
        #wrx-skids { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 129; pointer-events: none; }
        #wrx-car img { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
        #wrx-controls { position: absolute; left: 0; top: 0; z-index: 131; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .45s ease, visibility .45s ease; display: grid; grid-template-columns: repeat(3, 39px); grid-template-rows: repeat(3, 39px); gap: 4px; align-items: center; justify-items: center; user-select: none; }
        #wrx-controls.wrx-visible { opacity: .72; visibility: visible; pointer-events: auto; }
        #wrx-controls button { background: rgba(21,24,31,.58); border: 1px solid rgba(255,255,255,.19); color: white; border-radius: 9px; height: 39px; width: 39px; display: grid; place-items: center; cursor: pointer; font-size: 21px; font-family: system-ui, sans-serif; line-height: 1; touch-action: none; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(8px); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
        #wrx-controls button:is(:hover,:active) { background: #2368b6; }
        #wrx-controls .wrx-up { grid-column: 2; grid-row: 1; }
        #wrx-controls .wrx-left { grid-column: 1; grid-row: 2; }
        #wrx-controls .wrx-right { grid-column: 3; grid-row: 2; }
        #wrx-controls .wrx-down { grid-column: 2; grid-row: 3; }
        #wrx-controls .wrx-label { grid-column: 2; grid-row: 2; font-size: 9px; font-weight: 750; letter-spacing: .06em; color: #d5e9ff; text-align: center; text-shadow: 0 1px 2px #000; }
        /* Tap-to-drive on touch devices; leave desktop controls untouched. */
        @media (pointer: coarse) { #wrx-controls, #wrx-controls.wrx-visible { visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; } }
        @media (max-width: 600px) { #wrx-car { width: 20px; height: 33px; } #wrx-controls { grid-template-columns: repeat(3, 35px); grid-template-rows: repeat(3, 35px); gap: 3px; } #wrx-controls button { width: 35px; height: 35px; } }

/* Quiet, simple race invitation */
#wrx-race-invite {position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.40);backdrop-filter:blur(3px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s}
#wrx-race-invite.wrx-race-open {opacity:1;visibility:visible;pointer-events:auto}
#wrx-race-invite .wrx-race-card {width:min(310px,100%);background:#17191b;border:1px solid #505359;border-radius:13px;padding:25px 22px 21px;text-align:center;box-shadow:0 16px 50px #0009;color:white;font-family:system-ui,-apple-system,sans-serif}
#wrx-race-invite h2 {font-size:25px;line-height:1.2;margin:0 0 22px;color:#fff;font-weight:650;letter-spacing:-.035em}
#wrx-race-invite .wrx-race-actions {display:flex;gap:9px;align-items:stretch}
#wrx-race-invite .wrx-race-go,#wrx-race-invite .wrx-race-later {flex:1;text-decoration:none;border-radius:8px;padding:12px 8px;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer;display:grid;place-items:center}
#wrx-race-invite .wrx-race-go {background:#eee;color:#17191b;border:1px solid #eee}
#wrx-race-invite .wrx-race-later {background:transparent;color:#eee;border:1px solid #505359}
#wrx-race-invite :is(.wrx-race-go,.wrx-race-later):focus-visible {outline:2px solid #89b9ff;outline-offset:3px}
    </style>
</head>
<body>

    <div class="background-overlay"></div>

            <a href="https://www.instagram.com/adamcmoreno" class="social-icon-link" target="_blank" title="Instagram">

    <script>
        // Logo animation on scroll
        const logoFull = document.querySelector('.logo-full');
        const logoShort = document.querySelector('.logo-short');
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                logoFull.classList.add('hidden');
                logoShort.classList.add('visible');
            } else {
                logoFull.classList.remove('hidden');
                logoShort.classList.remove('visible');
            }
        });
        // Section fade-in on scroll
        const sections = document.querySelectorAll('section');
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };
        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);
        sections.forEach(section => {
            observer.observe(section);
        });
        // Infinite Shorts carousel scroll
        function initCarousel() {
            const carousel = document.querySelector('.shorts-carousel-auto');
            const isMobile = window.innerWidth < 768;
            // Only auto-scroll on desktop, allow manual swipe on mobile
            if (carousel && !isMobile) {
                const scrollSpeed = 0.5;
                function startCarouselScroll() {
                    const firstItem = carousel.querySelector('.short-item');
                    if (!firstItem || firstItem.offsetWidth === 0) {
                        setTimeout(startCarouselScroll, 100);
                        return;
                    }
                    const itemWidth = firstItem.offsetWidth + 20;
                    const resetPoint = itemWidth * 7;
                    function autoScroll() {
                        carousel.scrollLeft += scrollSpeed;
                        if (carousel.scrollLeft >= resetPoint) {
                            carousel.scrollLeft = 0;
                        }
                        requestAnimationFrame(autoScroll);
                    }
                    autoScroll();
                }
                startCarouselScroll();
                window.addEventListener('resize', function() {
                    setTimeout(startCarouselScroll, 100);
                });
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initCarousel);
        } else {
            initCarousel();
        }
        window.addEventListener('load', initCarousel);
    </script>

    <div id="wrx-controls" aria-label="Drive the WRX around the website">
      <button type="button" class="wrx-up" data-wrx-direction="up" aria-label="Drive up">↑</button>
      <button type="button" class="wrx-left" data-wrx-direction="left" aria-label="Drive left">←</button>
      <span class="wrx-label" aria-hidden="true"></span>
      <button type="button" class="wrx-right" data-wrx-direction="right" aria-label="Drive right">→</button>
      <button type="button" class="wrx-down" data-wrx-direction="down" aria-label="Drive down">↓</button>
    </div>

    <div id="wrx-race-invite" role="dialog" aria-modal="true" aria-labelledby="wrx-invite-title" aria-hidden="true">
      <div class="wrx-race-card">
        <h2 id="wrx-invite-title">Want to race? 👀</h2>
        <div class="wrx-race-actions">
          <a class="wrx-race-go" href="/race/">Sure</a>
          <button class="wrx-race-later" type="button" id="wrx-race-dismiss">No thanks</button>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const car = document.getElementById('wrx-car');
        const canvas = document.getElementById('wrx-skids');
        const ctx = canvas.getContext('2d');
        const keys = new Set();
        const isTouch = window.matchMedia('(pointer: coarse)').matches;
        let waypoint = null;
        const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
        // The car image faces upward at zero degrees. Movement follows the hood.
        // Each visit gets a different edge, approach lane, and parking position.
        // The heading stays aligned with the path throughout the entrance.
        const arrivalEdge = Math.floor(Math.random() * 4);
        const carW = innerWidth <= 600 ? 20 : 24;
        const carH = innerWidth <= 600 ? 33 : 39;
        const rand = (min, max) => min + Math.random() * Math.max(0, max - min);
        const screenInset = 72;
        let arrivalX = rand(Math.min(screenInset, innerWidth * .2), Math.max(screenInset, innerWidth - screenInset - carW));
        let arrivalY = rand(Math.min(screenInset, innerHeight * .2), Math.max(screenInset, innerHeight - screenInset - carH));
        let introFrom = [
          { x: -carH - 24, y: arrivalY, heading: Math.PI / 2 },
          { x: innerWidth + carH + 24, y: arrivalY, heading: -Math.PI / 2 },
          { x: arrivalX, y: -carH - 24, heading: Math.PI },
          { x: arrivalX, y: innerHeight + carH + 24, heading: 0 }
        ][arrivalEdge];
        let x = introFrom.x, y = introFrom.y;
        let angle = introFrom.heading, speed = 0, steer = 0, dragging = false;
        const controls = document.getElementById('wrx-controls');
        const invite = document.getElementById('wrx-race-invite');
        const dismissInvite = document.getElementById('wrx-race-dismiss');
        let activeDriveSeconds = 0;
        let raceInviteShown = sessionStorage.getItem('wrx-race-invite-seen') === '1';
        function closeRaceInvite() { invite.classList.remove('wrx-race-open'); invite.setAttribute('aria-hidden','true'); }
        function openRaceInvite() {
          if (raceInviteShown) return;
          raceInviteShown = true;
          sessionStorage.setItem('wrx-race-invite-seen','1');
          invite.classList.add('wrx-race-open'); invite.setAttribute('aria-hidden','false');
          keys.clear(); waypoint = null; speed = 0; steer = 0;
          dismissInvite.focus();
        }
        dismissInvite.addEventListener('click',closeRaceInvite);
        invite.addEventListener('click',e=>{if(e.target === invite) closeRaceInvite();});
        document.addEventListener('keydown',e=>{if(e.key==='Escape' && invite.classList.contains('wrx-race-open')) closeRaceInvite();});

        let introStart = null, introActive = true, introPositioned = false;
        const introDelay = 5000;
        let controlsUntil = 0;
        const introDuration = 2000;
        function revealControls(duration = 3050) {
          controlsUntil = performance.now() + duration;
          controls.classList.add('wrx-visible');
        }
        function placeControls() {
          // The hints follow the tiny car, but never extend off the screen.
          const cw = controls.offsetWidth, ch = controls.offsetHeight;
          const cx = x + car.offsetWidth / 2;
          const preferredX = cx - cw / 2;
          const preferredY = y + car.offsetHeight / 2 - ch / 2;
          const left = clamp(preferredX, 5, Math.max(5, document.documentElement.scrollWidth - cw - 5));
          const top = preferredY;
          controls.style.transform = `translate3d(${left}px, ${clamp(top, 5, Math.max(5, document.documentElement.scrollHeight - ch - 5))}px, 0)`;
        }
        function cancelIntro() { introActive = false; introStart = null; }
        let lastTime = 0, lastTires = null;
        const skidSegments = [];
        const skidHoldMs = 7000, skidFadeMs = 1000;
        const topSpeed = 395, reverseSpeed = -145;
        const acceleration = 440, braking = 660, rollingDrag = 155;
        const steeringRate = 2.65, steeringSmoothness = 9;
        let dpr = 1;
        function resizeCanvas() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(innerWidth * dpr);
          canvas.height = Math.round(innerHeight * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          lastTires = null;
        }
        function keepInView() {
          const halfWidth = car.offsetWidth / 2, halfHeight = car.offsetHeight / 2;
          const radius = Math.hypot(halfWidth, halfHeight);
          if (introActive) return;
          x = clamp(x, -halfWidth + radius, Math.max(-halfWidth + radius, document.documentElement.scrollWidth - halfWidth - radius));
          y = clamp(y, -halfHeight + radius, Math.max(-halfHeight + radius, document.documentElement.scrollHeight - halfHeight - radius));
        }
        function draw() {
          car.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${angle * 180 / Math.PI}deg)`;
        }
        function tirePositions() {
          const w = car.offsetWidth, h = car.offsetHeight;
          const cx = x + w / 2, cy = y + h / 2;
          const back = h * .32, side = w * .29;
          const forwardX = Math.sin(angle), forwardY = -Math.cos(angle);
          const rightX = Math.cos(angle), rightY = Math.sin(angle);
          return [-1, 1].map(sign => ({
            x: cx - forwardX * back + rightX * side * sign,
            y: cy - forwardY * back + rightY * side * sign
          }));
        }
        function renderTracks(now) {
          // Keep each individual skid segment fully visible for seven seconds,
          // then fade it away completely over the following second.
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          while (skidSegments.length && now - skidSegments[0].createdAt >= skidHoldMs + skidFadeMs) {
            skidSegments.shift();
          }
          ctx.save();
          ctx.lineCap = 'round';
          for (const segment of skidSegments) {
            const age = now - segment.createdAt;
            const opacity = age <= skidHoldMs ? 1 : Math.max(0, 1 - (age - skidHoldMs) / skidFadeMs);
            ctx.strokeStyle = `rgba(15, 17, 20, ${segment.alpha * opacity})`;
            ctx.lineWidth = segment.width;
            ctx.beginPath();
            ctx.moveTo(segment.x1 - scrollX, segment.y1 - scrollY);
            ctx.lineTo(segment.x2 - scrollX, segment.y2 - scrollY);
            ctx.stroke();
          }
          ctx.restore();
        }
        function tick(time) {
          const dt = Math.min((time - (lastTime || time)) / 1000, .035);
          lastTime = time;

          if (introActive) {
            if (introStart === null) introStart = time + introDelay;
            // On arrival, convert the entry lane to absolute page coordinates.
            // This keeps the WRX visible even if the visitor scrolled during the 5s delay.
            if (!introPositioned && time >= introStart) {
              const pageTop = window.scrollY, pageLeft = window.scrollX;
              arrivalX += pageLeft; arrivalY += pageTop;
              introFrom = { ...introFrom, x: introFrom.x + pageLeft, y: introFrom.y + pageTop };
              x = introFrom.x; y = introFrom.y;
              introPositioned = true;
            }
            const t = Math.max(0, Math.min(1, (time - introStart) / introDuration));
            // Roll in from the chosen edge and coast to a stop without snapping.
            const eased = 1 - Math.pow(1 - t, 3);
            x = introFrom.x + (arrivalX - introFrom.x) * eased;
            y = introFrom.y + (arrivalY - introFrom.y) * eased;
            if (t >= 1) {
              introActive = false;
              // Keep the same heading throughout the arrival: no rotation snap.
              placeControls();
              revealControls(3050);
            }
          }
          if (!introActive && !dragging && !invite.classList.contains('wrx-race-open')) {
            let gas = keys.has('up'), brake = keys.has('down');
            let turnInput = Number(keys.has('right')) - Number(keys.has('left'));
            if (isTouch && waypoint) {
              const dx = waypoint.x - (x + car.offsetWidth / 2);
              const dy = waypoint.y - (y + car.offsetHeight / 2);
              const distance = Math.hypot(dx, dy);
              const targetAngle = Math.atan2(dx, -dy);
              const headingError = Math.atan2(Math.sin(targetAngle - angle), Math.cos(targetAngle - angle));
              // Slow for tight turns and ease off the throttle as we arrive.
              const turnSeverity = Math.abs(headingError);
              const desiredSpeed = Math.min(225, Math.max(0, (distance - 9) * 2.6)) *
                (turnSeverity > 1.7 ? .26 : turnSeverity > .85 ? .48 : 1);
              if (distance < 13 && Math.abs(speed) < 35) {
                waypoint = null; gas = false; brake = false; turnInput = 0;
              } else {
                turnInput = clamp(headingError * 2.0, -1, 1);
                gas = speed < desiredSpeed - 8;
                brake = speed > desiredSpeed + 12;
              }
            }
            steer += (turnInput - steer) * (1 - Math.exp(-steeringSmoothness * dt));
            if (gas) speed += acceleration * dt;
            if (brake) speed -= (speed > 0 ? braking : acceleration * .58) * dt;
            if (!gas && !brake) {
              const slow = rollingDrag * dt;
              speed = Math.abs(speed) <= slow ? 0 : speed - Math.sign(speed) * slow;
            }
            speed = clamp(speed, isTouch && waypoint ? 0 : reverseSpeed, topSpeed);
            // Finish at rest once the target is reached.
            if (isTouch && !waypoint && !gas && !brake && Math.abs(speed) < 8) speed = 0;
            const moving = Math.abs(speed) > 3;
            if (moving) {
              if (!raceInviteShown && Math.abs(speed) > 25 && document.visibilityState === 'visible') {
                activeDriveSeconds += dt;
                if (activeDriveSeconds >= 20) openRaceInvite();
              }
              // Continuous, speed-sensitive steering, including proper reverse steering.
              const turnRate = steeringRate * (.3 + .7 * Math.min(Math.abs(speed) / 185, 1));
              const oldAngle = angle;
              angle += steer * turnRate * dt * Math.sign(speed);
              const rotation = Math.abs(angle - oldAngle) / Math.max(dt, .001);
              x += Math.sin(angle) * speed * dt;
              y -= Math.cos(angle) * speed * dt;
              const oldX = x, oldY = y;
              keepInView();
              if (oldX !== x || oldY !== y) speed *= .76;
              const tires = tirePositions();
              const hardCorner = Math.abs(steer) > .62 && Math.abs(speed) > 125 && rotation > .9;
              if (hardCorner && lastTires) {
                const alpha = clamp((Math.abs(speed) - 90) / 620, .08, .32);
                const width = Math.max(1.6, car.offsetWidth * .038);
                for (let i = 0; i < 2; i++) {
                  skidSegments.push({
                    x1: lastTires[i].x, y1: lastTires[i].y,
                    x2: tires[i].x, y2: tires[i].y,
                    alpha, width, createdAt: time
                  });
                }
              }
              lastTires = tires;
            } else lastTires = null;
          } else lastTires = null;
          renderTracks(time);
          draw();
          // Keep the arrow pad centered around the car even while hidden; never jump at reveal.
          placeControls();
          if (controls.classList.contains('wrx-visible')) {
            if (time > controlsUntil) {
              controls.classList.remove('wrx-visible');
            }
          }
          requestAnimationFrame(tick);
        }
        const directions = {
          ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
          w: 'up', s: 'down', a: 'left', d: 'right'
        };
        function typing() {
          const el = document.activeElement;
          return el?.matches('input,textarea,select,[contenteditable="true"]') || el?.closest('iframe');
        }
        window.addEventListener('keydown', e => {
          const dir = directions[e.key] || directions[e.key.toLowerCase()];
          if (dir && !typing() && !invite.classList.contains('wrx-race-open')) { if (introActive) cancelIntro(); waypoint = null; keys.add(dir); e.preventDefault(); }
        });
        window.addEventListener('keyup', e => {
          const dir = directions[e.key] || directions[e.key.toLowerCase()];
          if (dir) keys.delete(dir);
        });
        window.addEventListener('blur', () => { keys.clear(); steer = 0; });
        document.querySelectorAll('[data-wrx-direction]').forEach(button => {
          const dir = button.dataset.wrxDirection;
          button.addEventListener('pointerdown', e => {
            e.preventDefault(); if (introActive) cancelIntro(); waypoint = null; button.setPointerCapture(e.pointerId); keys.add(dir);
          });
          const stop = () => keys.delete(dir);
          button.addEventListener('pointerup', stop);
          button.addEventListener('pointercancel', stop);
          button.addEventListener('lostpointercapture', stop);
        });
        // Mobile: quick taps on noninteractive page areas give the WRX a destination.
        // Pointer movement / scrolling cancels the tap. Do not interfere with links or forms.
        let pendingTap = null;
        const excludedTap = target => !!target.closest('a,button,input,textarea,select,iframe,form,[contenteditable], [role="button"], #wrx-car, #wrx-controls, .shorts-carousel');
        document.addEventListener('pointerdown', e => {
          if (!isTouch || e.pointerType === 'mouse' || !e.isPrimary || excludedTap(e.target)) return;
          pendingTap = { id: e.pointerId, x: e.clientX, y: e.clientY, scrollX: scrollX, scrollY: scrollY, at: performance.now() };
        }, { passive: true });
        document.addEventListener('pointermove', e => {
          if (pendingTap && pendingTap.id === e.pointerId &&
              Math.hypot(e.clientX - pendingTap.x, e.clientY - pendingTap.y) > 12) pendingTap = null;
        }, { passive: true });
        document.addEventListener('pointercancel', () => { pendingTap = null; }, { passive: true });
        // Scrolling is navigation, not driving. Because the car has absolute
        // page coordinates, it naturally scrolls away with the content.
        // Cancel active auto-driving without changing its parked page position.
        let touchScrollY = window.scrollY, touchScrollX = window.scrollX;
        window.addEventListener('scroll', () => {
          if (!isTouch) return;
          if (Math.abs(window.scrollY - touchScrollY) > 0.5 ||
              Math.abs(window.scrollX - touchScrollX) > 0.5) {
            pendingTap = null;
            waypoint = null;
            speed = 0;
            steer = 0;
            lastTires = null;
          }
          touchScrollY = window.scrollY;
          touchScrollX = window.scrollX;
        }, { passive: true });
        document.addEventListener('pointerup', e => {
          if (!pendingTap || pendingTap.id !== e.pointerId) return;
          const t = pendingTap; pendingTap = null;
          if (introActive || excludedTap(e.target) || performance.now() - t.at > 450 ||
              Math.hypot(e.clientX - t.x, e.clientY - t.y) > 12 ||
              Math.abs(scrollX - t.scrollX) > 3 || Math.abs(scrollY - t.scrollY) > 3) return;
          waypoint = { x: e.clientX + window.scrollX, y: e.clientY + window.scrollY };
        }, { passive: true });
        let offsetX = 0, offsetY = 0;
        car.addEventListener('pointerdown', e => {
          if (introActive) cancelIntro();
          revealControls();
          waypoint = null; dragging = true; speed = 0; steer = 0; lastTires = null;
          offsetX = e.clientX + window.scrollX - x; offsetY = e.clientY + window.scrollY - y;
          car.setPointerCapture(e.pointerId); e.preventDefault();
        });
        car.addEventListener('pointermove', e => {
          if (!dragging) return;
          x = e.clientX + window.scrollX - offsetX; y = e.clientY + window.scrollY - offsetY;
          keepInView(); draw();
        });
        const stopDragging = () => { dragging = false; lastTires = null; };
        car.addEventListener('pointerup', stopDragging);
        car.addEventListener('pointercancel', stopDragging);
        car.addEventListener('lostpointercapture', stopDragging);
        window.addEventListener('resize', () => { resizeCanvas(); keepInView(); draw(); });
        resizeCanvas(); draw(); requestAnimationFrame(tick);
      })();
    </script>
</body>
</html>
